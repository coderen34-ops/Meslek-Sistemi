name: build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    if: ${{ !startsWith(github.ref_name, 'jar') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: mvn build (cikti log dosyasina da yazilir)
        run: |
          set -o pipefail
          mvn -B package 2>&1 | tee /tmp/build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: meslek-sistemi
          path: target/*.jar
      - name: Jar'i jar-claude dalina koy
        if: success()
        run: |
          mkdir -p /tmp/out && cp target/*.jar /tmp/out/
          # LibsDisguises'in gercek plugin jar'i da (.m2 onbellegindeki Maven artifact'i) birlikte koyulur,
          # sunucuya ayrica plugin olarak yuklenebilsin diye.
          find ~/.m2/repository/me/libraryaddict/disguises/libsdisguises -name "libsdisguises-*.jar" -exec cp {} /tmp/out/LibsDisguises.jar \; || true
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan jar-claude
          git rm -rf . -q
          cp /tmp/out/*.jar .
          git add -A
          git commit -q -m "derlenmis jar"
          git push -f origin jar-claude
      - name: Build log'u jar-claude-log dalina koy (log indirmek icin, blob storage engelliyse)
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan jar-claude-log
          git rm -rf . -q 2>/dev/null || true
          cp /tmp/build.log ./build.log
          git add -A
          git commit -q -m "build log"
          git push -f origin jar-claude-log
